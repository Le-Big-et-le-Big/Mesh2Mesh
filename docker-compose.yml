services:
  postgres:
    # postgres 17.11-alpine3.24
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: mesh
      POSTGRES_PASSWORD: mesh
      POSTGRES_DB: mesh2mesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesh -d mesh2mesh"]
      interval: 5s
      timeout: 5s
      retries: 10

  controlplane:
    build:
      context: .
      dockerfile: Containerfile.controlplane
    environment:
      DATABASE_URL: postgres://mesh:mesh@postgres:5432/mesh2mesh?sslmode=disable
    ports:
      - "8090:8090"
      - "51821:51821/udp"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
