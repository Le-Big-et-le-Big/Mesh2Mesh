# Mesh2Mesh login: base's templates and scripts, our layout and styles, made
# to match the web UI's own pages.
parent=base
styles=css/mesh2mesh.css
meta=viewport==width=device-width,initial-scale=1 color-scheme==light%20dark

# base's templates take their classes from here.
kcHtmlClass=m2m
kcBodyClass=m2m-body
kcLoginClass=m2m-page
kcFormCardClass=m2m-card
kcFormHeaderClass=m2m-card-header

kcFormClass=m2m-form
kcFormGroupClass=m2m-field
kcLabelClass=m2m-label
kcInputClass=m2m-input
kcInputGroup=m2m-input-group
kcInputErrorMessageClass=m2m-field-error
kcInputHelperTextBeforeClass=m2m-help
kcInputHelperTextAfterClass=m2m-help
kcFormSettingClass=m2m-options
kcFormOptionsWrapperClass=m2m-options-links
kcCheckboxInputClass=m2m-checkbox

kcButtonClass=m2m-button
kcButtonPrimaryClass=m2m-button-primary
kcButtonDefaultClass=m2m-button-secondary
kcButtonBlockClass=m2m-button-block
kcButtonLargeClass=m2m-button-large

kcFormPasswordVisibilityButtonClass=m2m-reveal
kcFormPasswordVisibilityIconShow=m2m-icon m2m-icon-eye
